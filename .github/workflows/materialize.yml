name: Materialize verified SignalProof source once
on:
  push:
    branches: [main]
    paths: [.github/workflows/materialize.yml]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify archive and restore proper source paths
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, io, zipfile, shutil
          root=Path.cwd().resolve()
          archive=root/'8-SignalProof_Complete.zip'
          payload=archive.read_bytes()
          expected='5f0369802ec2be77c607a57da01d15beadced656d4f00963ca3069f00b4fd0d2'
          assert hashlib.sha256(payload).hexdigest()==expected, 'Archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert len(z.infolist())<100, 'Unexpected archive count'
              for info in z.infolist():
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0]=='SignalProof' and len(p.parts)>1
                  assert not info.is_dir() and info.file_size<25000000
                  assert (info.external_attr >> 16) & 0o170000 != 0o120000, 'No symlinks'
                  target=root.joinpath(*p.parts[1:]).resolve()
                  assert target.is_relative_to(root), 'Path escapes repository'
                  assert '.git' not in p.parts and '.github' not in p.parts
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(info))
          (root/'SignalProof_Complete.zip').write_bytes(payload)
          archive.unlink()
          # Remove this one-time helper through the repository editor after verification.
      - name: Check published model parity and commit source tree
        shell: bash
        run: |
          node test.js
          git add -A
          git -c user.name='SignalProof source build' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'Restore verified complete source tree'
          git push
