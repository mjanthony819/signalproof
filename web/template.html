<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e37"><title>SignalProof | ECG artifact research lab</title><style>
:root{--ink:#251f21;--muted:#585254;--teal:#216c5a;--pale:#eaf4ef;--line:#e5e9e6;--sand:#f4efec;--red:#bd2635}*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit;max-width:100%}input[type=file]{width:100%;font-size:12px}button,select{min-height:44px}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:9px 16px;background:white;color:var(--ink);font-weight:600}button:hover{background:var(--pale)}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #bc9d4c;outline-offset:2px}a{color:var(--teal);overflow-wrap:anywhere}.wrap{max-width:1240px;margin:auto;padding:24px 30px}header{background:white;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:22px;font-weight:750;letter-spacing:-1px;display:flex;align-items:center;gap:10px}.brand svg{width:36px;height:36px}.badge,.pill{display:inline-block;font-size:11px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;color:var(--teal);background:var(--pale);padding:5px 9px;border-radius:5px}.small{font-size:13px;color:var(--muted)}nav{display:flex;gap:7px;flex-wrap:wrap;padding-top:18px}nav button{border:0;background:transparent;color:var(--muted);padding:8px 13px}nav button[aria-current=page]{background:var(--pale);color:var(--teal)}h1,h2,h3{line-height:1.16;font-weight:500;letter-spacing:-.035em;margin:0 0 15px}h1{font:400 43px/1.09 Georgia,serif;letter-spacing:-1.6px;max-width:700px}h2{font:400 27px/1.2 Georgia,serif}h3{font-size:18px;font-weight:650}p{margin:0 0 14px}.intro{padding:30px 0 20px;display:flex;gap:32px;justify-content:space-between;align-items:center}.intro p{max-width:670px;color:var(--muted);margin-top:16px}.intro .eyebrow{font-size:11px;font-weight:750;letter-spacing:.15em;color:var(--teal);margin-bottom:14px}.status{background:white;border:1px solid var(--line);padding:18px 22px;border-radius:10px;min-width:190px}.status strong{font-size:28px;display:block;line-height:1.2}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,1fr);gap:20px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:23px;margin-bottom:20px;min-width:0}.card.soft{background:var(--pale)}.row{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:14px 0}.controls>*{flex:1;min-width:135px}label{font-size:13px;font-weight:600;display:block}select,input[type=text],input[type=number],textarea{width:100%;border:1px solid #cdd7d1;border-radius:6px;padding:10px;background:white;color:var(--ink)}input[type=range]{width:100%;accent-color:var(--teal);min-height:30px}textarea{min-height:145px;resize:vertical}canvas{width:100%;height:210px;display:block;border-radius:8px;background:#f5f9f6;margin:12px 0}.notice{padding:12px 15px;background:var(--sand);border-radius:7px;font-size:13px;margin-bottom:20px}.error{color:var(--red)}.model{padding:17px 0;border-top:1px solid var(--line)}.model:first-child{border:0}.barrow{display:grid;grid-template-columns:112px minmax(30px,1fr) 42px;gap:8px;align-items:center;font-size:12px;margin:9px 0}.bar{height:7px;border-radius:5px;background:#edf1ee;overflow:hidden}.bar i{height:100%;display:block;background:#78a596}.bar i.strong{background:var(--teal)}.decision{font-weight:650;color:var(--teal);font-size:16px}.decision.abstain{color:#865d20}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.metric{background:#f6f8f6;padding:15px;border-radius:8px}.metric strong{font-size:25px;display:block;font-weight:500;letter-spacing:-1px}.metric span{font-size:12px;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.confusion{display:grid;grid-template-columns:85px repeat(4,1fr);gap:3px;font-size:12px}.confusion>div{text-align:center;padding:10px 3px;border-radius:4px;overflow-wrap:anywhere}.confusion .axis{font-size:10px;color:var(--muted);font-weight:600}.item{border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.item p{font-size:13px;color:var(--muted);margin:5px 0}.blank{padding:30px 0;color:var(--muted);text-align:center}.tag{font-size:12px;background:var(--sand);padding:3px 7px;border-radius:4px}.steps{counter-reset:step}.steps p{position:relative;padding-left:36px;margin:20px 0}.steps p:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;background:var(--pale);color:var(--teal);width:25px;height:25px;text-align:center;border-radius:50%;font-weight:700}.mono{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}details{padding:13px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:650;min-height:30px}details p{font-size:14px;margin-top:14px}footer{padding:24px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}.hide{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#173e37;color:white;border-radius:9px;box-shadow:0 3px 20px #0002;max-width:92%;z-index:10}code{background:var(--sand);padding:2px 5px;border-radius:4px}ul{padding-left:20px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table-scroll{overflow-x:auto}.evidence-model{min-width:0}.statline{padding:12px 0;border-bottom:1px solid var(--line)}.statline strong{color:var(--teal)}.section{animation:appear .18s ease}@keyframes appear{from{opacity:.4}to{opacity:1}}
@media(max-width:800px){.grid,.two{grid-template-columns:1fr}.wrap{padding:18px}.intro{align-items:start}.status{display:none}h1{font-size:36px}.metrics{grid-template-columns:1fr 1fr}.top .small{max-width:130px;text-align:right}.confusion{grid-template-columns:64px repeat(4,1fr)}}@media(max-width:380px){.wrap{padding:14px}.card{padding:16px}h1{font-size:32px}nav{gap:1px}nav button{font-size:12px;padding:8px}.brand{font-size:20px}.top .small{font-size:11px;max-width:105px}.barrow{grid-template-columns:103px 1fr 36px}}
</style></head><body><header><div class="wrap"><div class="top"><div class="brand"><svg viewBox="0 0 40 40" aria-label="SignalProof waveform logo"><rect width="40" height="40" rx="11" fill="#216c5a"/><path d="M5 22h7l3-9 5 18 5-24 4 15h6" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>SignalProof</div><span class="small">ECG artifact research lab<br>Local inference · no account</span></div><nav aria-label="Main navigation" id="nav"></nav></div></header><main class="wrap"><div id="app"></div><footer>SignalProof 1.0 · Research and education only. Not a medical device, diagnostic test or clinical quality gate. Built with AI assistance, disclosed in the guide.</footer></main><div id="toast" class="toast hide" role="status"></div>
<script>/*EMBED_DATA*/</script><script>/*INFERENCE*/</script><script>
'use strict';
const {weights:W,results:R,samples:S,predictions:P}=DATA;
const tabs=[['lab','Signal lab'],['stress','Stress bench'],['evidence','Evidence'],['errors','Error explorer'],['sessions','Notebook'],['guide','Field guide']];
const $=s=>document.querySelector(s),pct=(n,d=1)=>(100*n).toFixed(d)+'%',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let route=location.hash.slice(1)||'lab',sample=S[0],signal=sample.signal.slice(),source=sample.name,threshold=.7,pred=null,session=[],storageOK=true,stressResult=null;
try{session=JSON.parse(localStorage.getItem('signalproof-notebook-v1')||'[]');if(!Array.isArray(session))session=[];}catch(e){storageOK=false;session=[];}
function persist(){try{localStorage.setItem('signalproof-notebook-v1',JSON.stringify(session));return true;}catch(e){storageOK=false;return false;}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),3600)}
function download(name,obj,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function nav(){if(!tabs.some(t=>t[0]===route))route='lab';$('#nav').innerHTML=tabs.map(([id,t])=>`<button data-tab="${id}" ${route===id?'aria-current="page"':''}>${t}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>location.hash=b.dataset.tab);}
window.onhashchange=()=>{route=location.hash.slice(1)||'lab';render();window.scrollTo(0,0)};
function intro(eyebrow,title,copy){return `<section class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${copy}</p></div><div class="status"><span class="small">Held-out test windows</span><strong>1,800</strong><span class="small">3 unseen reference records</span></div></section>`}
function notice(){return `<div class="notice"><strong>Artifact signatures, not patient advice.</strong> A "Reference" prediction means resemblance to ECGs without our added noise. It does not mean normal rhythm, good signal or safe to use.</div>`}
function options(){return (S.some(s=>s.name===source)?'':'<option value="custom" selected>Current imported research signal</option>')+S.map(s=>`<option value="${s.id}" ${source===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}
function wave(id,x,color='#216c5a'){let c=document.getElementById(id);if(!c)return;let b=c.getBoundingClientRect();c.width=Math.floor(b.width*devicePixelRatio);c.height=210*devicePixelRatio;let ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);let w=b.width,h=210;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#dfe8e1';ctx.lineWidth=1;for(let t=0;t<=8;t++){let a=20+(w-35)*t/8;ctx.beginPath();ctx.moveTo(a,15);ctx.lineTo(a,180);ctx.stroke();}for(let y=40;y<180;y+=35){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(w-15,y);ctx.stroke();}let max=Math.max(...x.map(Math.abs),1)*1.05;ctx.strokeStyle=color;ctx.lineWidth=1.3;ctx.beginPath();x.forEach((v,i)=>{let xx=20+(w-35)*i/(x.length-1),yy=97-v/max*77;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke();ctx.fillStyle='#585254';ctx.font='11px system-ui';ctx.fillText('0 s',20,200);ctx.fillText('8 s',w-35,200);ctx.fillText('RMS-normalized amplitude',30,28)}
function modelHTML(name,p){let top=p.indexOf(Math.max(...p)),confidence=p[top],abstain=confidence<threshold;return `<div class="model"><div class="row"><strong>${name==='cnn'?'Trained 1D CNN':'Spectral logistic baseline'}</strong><span class="tag">${pct(confidence)} max</span></div><div class="decision ${abstain?'abstain':''}">${abstain?'Abstain: low confidence':R.classes[top]}</div>${R.classes.map((n,i)=>`<div class="barrow"><span>${n}</span><div class="bar"><i class="${i===top?'strong':''}" style="width:${100*p[i]}%"></i></div><span>${pct(p[i],0)}</span></div>`).join('')}</div>`}
function infer(){let t=performance.now();pred=SignalProof.predict(signal,W);pred.ms=performance.now()-t;let o=$('#outputs');if(o)o.innerHTML=modelHTML('cnn',pred.cnn)+modelHTML('baseline',pred.baseline)+`<p class="small">${pred.ms.toFixed(1)} ms measured in this browser, including both models and features. Fixed validation temperatures. Confidence is not a clinical probability.</p>`;}
function lab(){return intro('01 / Inspect & compare','Before trusting a signal,<br>test what changed.','Compare a trained 1D CNN with a spectral baseline on ECG artifact signatures. Inspect uncertainty, keep a research notebook and follow every score back to its test protocol.')+notice()+`<div class="grid"><div><section class="card"><div class="row"><h2>Signal workspace</h2><span class="badge">8 seconds · 128 Hz</span></div><label for="sample">Attributed research example</label><select id="sample">${options()}</select><canvas id="wave" aria-label="Selected normalized ECG waveform"></canvas><p id="source" class="small">${esc(source)}</p><div class="controls"><button id="run" class="primary">Run both models</button><button id="exportSignal">Export signal CSV</button></div><details><summary>Import a research signal</summary><p>Only de-identified, single-channel research data. Exactly 1,024 numeric rows sampled at 128 Hz; optional first row <code>signal</code>. The app does not resample, validate device calibration or detect private information. Nothing is uploaded.</p><label for="csvFile">Choose CSV</label><input type="file" id="csvFile" accept=".csv,.txt"><label for="csvText">Or paste one numeric column</label><textarea id="csvText" placeholder="signal&#10;0.12&#10;0.08&#10;..."></textarea><button id="importCSV">Validate & load</button><p id="csvError" role="alert" class="error"></p></details></section><section class="card"><h3>Save a reproducible observation</h3><label for="note">Research note (optional)</label><input id="note" type="text" maxlength="300" placeholder="What surprised you? No patient information."><div class="controls"><button id="save">Save to notebook</button><button id="exportRun">Export this experiment</button></div><p class="small">Device-local history, not an account or cloud backup. ${storageOK?'Export a backup before changing devices.':'Storage is unavailable. Export instead; this session is temporary.'}</p></section></div><aside><section class="card"><div class="row"><h2>Model comparison</h2><span class="badge">Real inference</span></div><label for="threshold">Abstain below <span id="thresholdValue">${pct(threshold,0)}</span></label><input id="threshold" type="range" min="0.25" max="0.95" step="0.05" value="${threshold}"><p class="small">An exploratory confidence rule, not a validated safety threshold. Both models can be confidently wrong.</p><div id="outputs"></div></section><section class="card soft"><h3>A useful disagreement</h3><p>The CNN raises held-out macro F1 from ${R.test.baseline.macro_f1.toFixed(3)} to ${R.test.cnn.macro_f1.toFixed(3)}, but has worse log loss. Deep learning is not better on every metric.</p><button data-goto="evidence">Read the evidence</button></section></aside></div>`}
function getExperiment(){if(!pred)infer();return {schema:'signalproof-experiment-v1',created:new Date().toISOString(),source,signal:signal.slice(),threshold,cnn:pred.cnn,baseline:pred.baseline,note:$('#note')?.value||'',modelVersion:'1.0',samplingHz:128,warning:'Research-only artifact signatures. No clinical quality or diagnosis claim.'}}
function labEvents(){wave('wave',SignalProof.norm(signal));infer();$('#sample').onchange=e=>{if(e.target.value==='custom')return;sample=S.find(s=>s.id===e.target.value);signal=sample.signal.slice();source=sample.name;$('#source').textContent=source;wave('wave',SignalProof.norm(signal));infer()};$('#run').onclick=()=>{infer();toast('Both trained models ran locally.')};$('#threshold').oninput=e=>{threshold=+e.target.value;$('#thresholdValue').textContent=pct(threshold,0);infer()};$('#exportSignal').onclick=()=>download('signalproof-signal.csv','signal\n'+signal.join('\n'),'text/csv');$('#importCSV').onclick=()=>{try{signal=SignalProof.validateCSV($('#csvText').value);source='Imported research CSV (unverified origin)';$('#sample').innerHTML=options();$('#source').textContent=source;$('#csvError').textContent='';wave('wave',SignalProof.norm(signal));infer();toast('Validated shape and numbers only. Origin and meaning are not verified.')}catch(e){$('#csvError').textContent=e.message}};$('#csvFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>100000){$('#csvError').textContent='File exceeds 100 KB.';return}$('#csvText').value=await f.text()};$('#save').onclick=()=>{session.unshift(getExperiment());session=session.slice(0,50);let ok=persist();toast(ok?'Saved locally. Export a backup to keep it.':'Held in memory only. Use export; storage is unavailable.')};$('#exportRun').onclick=()=>download('signalproof-experiment.json',getExperiment());}
function stress(){return intro('02 / Challenge a prediction','Turn confidence<br>into a testable question.','Add controlled digital perturbations to the current signal. A robustness check is a comparison, not evidence that the altered signal is clinically usable.')+notice()+`<div class="grid"><section class="card"><h2>Controlled perturbation</h2><p class="small">Starting signal: ${esc(source)}. Change examples in Signal lab. Artificial perturbations are not a simulation of every real electrode or device.</p><div class="controls"><label>Added pattern<select id="stressType"><option value="wander">0.25 Hz sine drift</option><option value="white">Seeded white noise</option><option value="clip">Symmetric clipping</option><option value="reverse">Time reversal (out of distribution)</option></select></label><label>Strength (relative RMS)<input id="strength" type="number" min="0" max="3" step="0.1" value="0.5"></label></div><button id="stressRun" class="primary">Run perturbation</button><canvas id="stressWave" aria-label="Perturbed waveform"></canvas><div id="stressInfo" class="small">Select a pattern and run the test.</div><div class="controls"><button id="stressExport">Export stress experiment</button></div></section><section class="card"><h2>Before → after</h2><div id="stressOutputs"><p>Run a perturbation to compare predictions.</p></div><p class="small">The original example's class label is not a valid ground-truth label for these new mixtures. No accuracy is computed here.</p></section></div>`}
function stressEvents(){$('#stressRun').onclick=()=>{let a=Number($('#strength').value),type=$('#stressType').value;if(!Number.isFinite(a)||a<0||a>3){toast('Strength must be between 0 and 3.');return}let x=SignalProof.norm(signal),seed=42;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}let y=x.map((v,i)=>type==='wander'?v+a*Math.sqrt(2)*Math.sin(2*Math.PI*.25*i/128):type==='white'?v+a*(rand()+rand()+rand()+rand()+rand()+rand()-3)*Math.sqrt(2):type==='clip'?Math.max(-Math.max(.05,3-a),Math.min(Math.max(.05,3-a),v)):x[x.length-1-i]);let before=SignalProof.predict(x,W),after=SignalProof.predict(y,W);stressResult={schema:'signalproof-stress-v1',source,type,strength:a,seed:42,before,after,signal:y,warning:'No ground truth for generated mixture. Not clinical robustness validation.'};wave('stressWave',SignalProof.norm(y));$('#stressInfo').textContent=`${type}, strength ${a}, deterministic seed 42. RMS normalization occurs again before inference.`;$('#stressOutputs').innerHTML=['cnn','baseline'].map(m=>{let b=before[m].indexOf(Math.max(...before[m])),j=after[m].indexOf(Math.max(...after[m]));return `<div class="model"><h3>${m==='cnn'?'1D CNN':'Spectral baseline'}</h3><p>${R.classes[b]} (${pct(before[m][b])})<br>→ ${R.classes[j]} (${pct(after[m][j])})</p><p class="small">Probability shift L1: ${before[m].reduce((s,v,i)=>s+Math.abs(v-after[m][i]),0).toFixed(3)}</p></div>`}).join('')};$('#stressExport').onclick=()=>stressResult?download('signalproof-stress.json',stressResult):toast('Run a stress test first.');}
function matrix(name){let cm=R.test[name].confusion_matrix,max=Math.max(...cm.flat());return `<div class="confusion"><div></div>${R.classes.map(c=>`<div class="axis">${c}</div>`).join('')}${cm.map((r,i)=>`<div class="axis">${R.classes[i]}</div>`+r.map(v=>`<div style="background:rgba(33,108,90,${.05+.32*v/max})">${v}</div>`).join('')).join('')}</div>`}
function modelEvidence(m){let d=R.test[m];return `<section class="card evidence-model"><div class="row"><h2>${m==='cnn'?'1D CNN':'Spectral baseline'}</h2><span class="badge">${m==='cnn'?'816 parameters':'12 features'}</span></div><div class="metrics"><div class="metric"><strong>${pct(d.accuracy)}</strong><span>Accuracy</span></div><div class="metric"><strong>${d.macro_f1.toFixed(3)}</strong><span>Macro F1</span></div><div class="metric"><strong>${d.nll.toFixed(3)}</strong><span>Log loss ↓</span></div><div class="metric"><strong>${d.ece_10_bins.toFixed(3)}</strong><span>10-bin ECE ↓</span></div></div><h3>Confusion matrix</h3><p class="small">Rows: injected class. Columns: predicted class. Each class has 450 test windows.</p>${matrix(m)}<h3 style="margin-top:24px">Per-class F1</h3>${R.classes.map(c=>`<div class="statline row"><span>${c}</span><strong>${d.per_class[c]['f1-score'].toFixed(3)}</strong></div>`).join('')}<h3 style="margin-top:24px">Injected-noise severity</h3><p class="small">Each SNR slice also includes all 450 reference windows, so slice sizes differ. More negative dB means more added noise.</p>${[-6,0,6,12].map(s=>`<div class="statline row"><span>${s} dB</span><strong>F1 ${R.by_snr[m][s].macro_f1.toFixed(3)}</strong></div>`).join('')}<p class="small" style="margin-top:18px">Python CPU median latency: ${R.latency_ms[m].median.toFixed(2)} ms, p95 ${R.latency_ms[m].p95.toFixed(2)} ms. 10 warmups + 100 single-window runs. Not browser or device performance.</p></section>`}
function evidence(){return intro('03 / No score without a protocol','The model is measured.<br>The claim stays narrow.','The CNN improves macro F1 on these held-out artificial artifact labels. Neither model is ready to decide whether a patient signal should be accepted or discarded.')+`<div class="notice"><strong>Research finding:</strong> CNN accuracy ${pct(R.test.cnn.accuracy)} versus ${pct(R.test.baseline.accuracy)} baseline. CNN log loss ${R.test.cnn.nll.toFixed(3)} is worse than baseline ${R.test.baseline.nll.toFixed(3)}. Chance accuracy for balanced four-class guessing is 25%.</div><section class="card"><h2>Leakage-aware, not clinically validated</h2><div class="two"><div><h3>Separate reference records</h3><p class="small">Train: ${R.records.train.join(', ')} (3,600 windows).<br>Validation: ${R.records.validation.join(', ')} (1,200).<br>Test: ${R.records.test.join(', ')} (1,800).</p><p class="small">150 non-overlapping 8-second reference windows per record, stride 10 seconds. Each reference window produces all four labels, kept in the same split. Records 201/202, the known same-subject pair, are not used.</p></div><div><h3>Separate noise time blocks</h3><p class="small">Train: 0–880 seconds.<br>Validation: 910–1,300 seconds.<br>Test: 1,330–1,790 seconds.</p><p class="small">The same three noise recordings supply disjoint time blocks, with gaps. Noise identities and collection setup are not held out. Within-split noise reuse is possible. Windows are correlated; 1,800 windows are not 1,800 patients.</p></div></div><p class="small">Target labels are known by construction: no added noise or one added artifact at -6, 0, 6 or 12 dB. Reference ECGs may already contain noise or arrhythmias. No expert clinical signal-quality labels are used. Model selection (minimum validation log loss, 32 epochs) and temperature fitting use validation only. Test data is evaluated afterward, not used to tune models.</p><div class="controls"><button id="downloadResults">Export full measured results</button><button id="downloadPredictions">Export 1,800 predictions</button></div></section><div class="two">${modelEvidence('cnn')}${modelEvidence('baseline')}</div><section class="card"><h2>Abstention trade-off</h2><label for="coverageThreshold">Exploratory confidence threshold <span id="coverageValue">70%</span></label><input id="coverageThreshold" type="range" min=".25" max=".95" step=".05" value=".7"><div id="coverageStats"></div><p class="small">Selective accuracy is computed only on accepted windows; coverage is the share accepted. Raising confidence can hide most cases. No minimum accuracy guarantee is implied. Do not choose a deployment threshold from this test-set explorer.</p></section>`}
function evidenceEvents(){$('#downloadResults').onclick=()=>download('signalproof-results.json',R);$('#downloadPredictions').onclick=()=>download('signalproof-test-predictions.json',P);function coverage(){let t=+$('#coverageThreshold').value;$('#coverageValue').textContent=pct(t,0);$('#coverageStats').innerHTML=['cnn','baseline'].map(m=>{let accepted=P.filter(p=>Math.max(...p[m+'_probs'])>=t),correct=accepted.filter(p=>p[m+'_probs'].indexOf(Math.max(...p[m+'_probs']))===p.label).length;return `<div class="statline"><strong>${m==='cnn'?'1D CNN':'Baseline'}</strong>: coverage ${pct(accepted.length/P.length)}, accuracy ${accepted.length?pct(correct/accepted.length):'not defined'} (${accepted.length} accepted)</div>`}).join('')}$('#coverageThreshold').oninput=coverage;coverage();}
function errors(){return intro('04 / Investigate failure','Good science keeps<br>the wrong answers visible.','Filter all 1,800 held-out predictions. Every row carries a reference record, sample offset and known injection setting. A model error is not a patient finding.')+`<section class="card"><div class="controls"><label>Model<select id="errorModel"><option value="cnn">1D CNN</option><option value="baseline">Spectral baseline</option></select></label><label>Show<select id="errorFilter"><option value="wrong">Wrong predictions</option><option value="disagree">Model disagreements</option><option value="all">All predictions</option></select></label><label>Injected class<select id="errorClass"><option value="all">All classes</option>${R.classes.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select></label></div><p id="errorCount" class="small"></p><div id="errorRows"></div><button id="exportErrors">Export filtered predictions</button></section>`}
let filtered=[];function errorEvents(){function update(){let m=$('#errorModel').value,filter=$('#errorFilter').value,cls=$('#errorClass').value;filtered=P.filter(p=>{let z=p[m+'_probs'],j=z.indexOf(Math.max(...z)),b=p.baseline_probs.indexOf(Math.max(...p.baseline_probs)),c=p.cnn_probs.indexOf(Math.max(...p.cnn_probs));return(cls==='all'||p.label===+cls)&&(filter==='all'||filter==='wrong'&&j!==p.label||filter==='disagree'&&b!==c)}).sort((a,b)=>Math.max(...b[m+'_probs'])-Math.max(...a[m+'_probs']));$('#errorCount').textContent=`${filtered.length} matching windows. Showing the 30 most confident first. Export includes every match.`;$('#errorRows').innerHTML=filtered.slice(0,30).map(p=>{let z=p[m+'_probs'],j=z.indexOf(Math.max(...z));return `<div class="item"><div class="row"><strong>${R.classes[p.label]} → ${R.classes[j]}</strong><span class="tag">${pct(z[j])} confidence</span></div><p>Record ${p.record} · ${(p.reference_start_sample_128hz/128).toFixed(0)}–${(p.reference_start_sample_128hz/128+8).toFixed(0)} s · ${p.snr_db===null?'No added noise':p.snr_db+' dB injection'}${p.noise_start_sample_128hz===null?'':' · noise offset '+(p.noise_start_sample_128hz/128).toFixed(2)+' s'}</p></div>`}).join('')||'<p class="blank">No matches for these filters.</p>'}['errorModel','errorFilter','errorClass'].forEach(id=>$('#'+id).onchange=update);$('#exportErrors').onclick=()=>download('signalproof-filtered-predictions.json',filtered);update();}
function sessions(){return intro('05 / Keep a research trail','An observation is better<br>when you can replay it.','Save signals, model probabilities, threshold and notes on this device. Export backups for durable storage. No sign-in, collaboration or cloud sync is claimed.')+`<section class="card"><div class="row"><h2>Research notebook</h2><span class="badge">${session.length} / 50 experiments</span></div><p class="small">${storageOK?'Stored in this browser only.':'Browser storage unavailable. In-memory only; export before closing.'} Saving beyond 50 experiments replaces the oldest. Backups contain raw signals, so use only de-identified research data.</p><div class="controls"><button id="backup">Export notebook backup</button><label>Restore validated backup<input id="restore" type="file" accept=".json"></label></div><p id="restoreError" class="error" role="alert"></p><div id="sessionRows">${session.map((s,i)=>`<div class="item"><div class="row"><strong>${esc(s.source)}</strong><span class="small">${esc(new Date(s.created).toLocaleString())}</span></div><p>${esc(s.note||'No note')} · threshold ${pct(s.threshold,0)}</p><div class="controls"><button data-replay="${i}">Replay signal</button><button data-delete="${i}">Delete experiment</button></div></div>`).join('')||'<p class="blank">No experiments yet. Run an example in Signal lab, add a note and save it.</p>'}</div></section>`}
function sessionEvents(){$('#backup').onclick=()=>download('signalproof-notebook.json',{schema:'signalproof-notebook-v1',experiments:session});$('#restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('Backup must be under 2 MB.');let j=JSON.parse(await f.text());if(j.schema!=='signalproof-notebook-v1'||!Array.isArray(j.experiments)||j.experiments.length>50)throw Error('Expected a SignalProof notebook with no more than 50 experiments.');for(let x of j.experiments){if(x.schema!=='signalproof-experiment-v1'||typeof x.source!=='string'||x.source.length>300||typeof x.note!=='string'||x.note.length>300||!Number.isFinite(x.threshold)||x.threshold<.25||x.threshold>.95||!Number.isFinite(Date.parse(x.created)))throw Error('Malformed experiment metadata.');SignalProof.validateCSV(x.signal?.join('\n')||'');for(let m of ['cnn','baseline'])if(!Array.isArray(x[m])||x[m].length!==4||x[m].some(n=>!Number.isFinite(n)||n<0||n>1)||Math.abs(x[m].reduce((a,b)=>a+b,0)-1)>.001)throw Error('Invalid probabilities.');}if(!confirm('Replace this device notebook with '+j.experiments.length+' experiments? Export the current notebook first if needed.'))return;session=j.experiments;persist();render();toast('Backup restored. Replays recompute current model predictions.')}catch(e){$('#restoreError').textContent=e.message}};document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>{let s=session[+b.dataset.replay];signal=s.signal.slice();source=s.source;threshold=s.threshold;location.hash='lab'});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this local experiment?')){session.splice(+b.dataset.delete,1);persist();render()}})}
function guide(){return intro('06 / Understand before using','Know what the model<br>can and cannot tell you.','A reproducible signal-processing project for students and research engineers. Read the limits before interpreting any prediction or importing a signal.')+`<div class="grid"><div><section class="card"><h2>Start in four steps</h2><div class="steps"><p>Pick an attributed research example in Signal lab. Run both models and compare the four artifact probabilities.</p><p>Raise the exploratory abstention threshold. Notice that low coverage can make selective accuracy look strong.</p><p>Use Stress bench to perturb a signal, then inspect failures in Error explorer. Mixture labels are not known.</p><p>Save your observation to Notebook, export a backup and read Evidence before quoting any score.</p></div></section><section class="card"><h2>Method & model card</h2><details open><summary>What is actually trained?</summary><p>A 12-feature multinomial logistic classifier and a small 1D convolutional neural network. The CNN has Conv1D(1→8, kernel 9, stride 4), ReLU, Conv1D(8→12, kernel 7, stride 4), ReLU, global average pooling and a four-class linear head. It has 816 trainable parameters. AdamW, learning rate 0.003, weight decay 0.001, 32 epochs, batch 128, seed 42. The best validation log-loss checkpoint is retained.</p></details><details><summary>Preprocessing & calibration</summary><p>Use the first channel from 360 Hz records, resample with polyphase 16/45 to 128 Hz, extract 1,024 samples, subtract mean and divide by RMS. Baseline features are six Welch relative band powers, mean absolute first difference, difference standard deviation and energy, fourth moment, absolute peak and zero-crossing rate. Standardization fits training data only. Separate scalar temperatures fit validation log loss: CNN ${W.temperatures.cnn.toFixed(3)}, baseline ${W.temperatures.baseline.toFixed(3)}.</p></details><details><summary>What could go wrong?</summary><p>Artificial additive labels do not establish clinical usability. The three noise recordings share a single dataset acquisition context. Only 11 reference records are used, with 3 held out. Rhythm, lead, device, demographic and simultaneous-noise shifts remain untested. Some reference signals already contain artifacts. A high-confidence Reference output can coexist with dangerous arrhythmia or poor signal. No rhythm or disease assessment is performed.</p></details><details><summary>Who benefits, and who could be harmed?</summary><p>Students can inspect feature versus CNN behavior and practice leakage-aware evaluation. Research engineers can reproduce a small benchmark. Patients or clinicians could be harmed if these scores replace clinical review or suppress a usable ECG. Do not use this tool for diagnosis, triage, monitoring decisions, ECG rejection, emergency decisions or patient advice.</p></details><details><summary>Another month</summary><p>Add independent expert-labeled quality datasets with compatible terms, subject/device-external evaluation, record-level bootstrap intervals and noise-source holdout. Investigate simultaneous artifacts, subgroup robustness, model calibration transfer and appropriate abstention costs with domain experts. No clinical deployment without a separate validation program.</p></details></section></div><aside><section class="card"><h2>Attribution & sources</h2><p class="small">Signal excerpts and artifact sources are from PhysioNet under the Open Data Commons Attribution License 1.0. This app uses an adapted, small semi-synthetic sample database. Original database rights stay with their owners. No endorsement is implied.</p><ul><li><a href="https://physionet.org/content/mitdb/1.0.0/" target="_blank" rel="noopener">MIT-BIH Arrhythmia Database v1.0.0</a><br><span class="small">Moody GB, Mark RG. 2001. DOI 10.1109/51.932724.</span></li><li><a href="https://physionet.org/content/nstdb/1.0.0/" target="_blank" rel="noopener">MIT-BIH Noise Stress Test Database v1.0.0</a><br><span class="small">Moody GB, Muldrow WE, Mark RG. 1984; Computers in Cardiology 11:381–384.</span></li><li><a href="https://physionet.org/content/mitdb/view-license/1.0.0/" target="_blank" rel="noopener">Reference data license: ODC-BY 1.0</a></li><li><a href="https://physionet.org/content/nstdb/view-license/1.0.0/" target="_blank" rel="noopener">Noise data license: ODC-BY 1.0</a></li></ul><p class="small">PhysioNet platform: Goldberger et al., Circulation 2000;101:e215–e220. DOI 10.1161/01.CIR.101.23.e215.</p></section><section class="card soft"><h3>AI assistance disclosure</h3><p>Instinct AI assisted with concept, code, training scripts, analysis, tests, UI, documentation and demo narration. Scores come from executed training/evaluation, not generated claims. The project author should study the manual before presenting.</p></section><section class="card"><h3>Offline & privacy</h3><p class="small">This single HTML file includes model weights, research examples and measured results. Open it in a modern desktop browser without installation or internet. Inference, CSV parsing and notebook data stay in the browser. No telemetry, paid API or login. Browser settings can block local storage, so export your work.</p><button id="saveOffline">Download offline app</button><div id="packageLinks"></div></section></aside></div>`}
function render(){nav();let views={lab,stress,evidence,errors,sessions,guide};$('#app').innerHTML='<div class="section">'+views[route]()+'</div>';({lab:labEvents,stress:stressEvents,evidence:evidenceEvents,errors:errorEvents,sessions:sessionEvents,guide:()=>{$('#saveOffline').onclick=()=>download('SignalProof_Offline.html','<!doctype html>'+document.documentElement.outerHTML,'text/html')}})[route]();document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>location.hash=b.dataset.goto)}
render();window.addEventListener('resize',()=>{if(route==='lab')wave('wave',SignalProof.norm(signal));if(route==='stress'&&stressResult)wave('stressWave',SignalProof.norm(stressResult.signal))});
